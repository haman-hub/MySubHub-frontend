<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TON Subscriptions</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/tonweb@0.0.61/dist/tonweb.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    .glow-blue {
      box-shadow: 0 0 20px -5px rgba(37, 99, 235, 0.4), 0 0 40px -10px rgba(37, 99, 235, 0.2);
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 9999px;
    }
    .hidden-page { display: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">

  <header id="nav-bar" class="sticky top-0 z-50 backdrop-blur-md bg-slate-900/80 border-b border-slate-800 px-4 py-3 flex items-center justify-between hidden">
    <div class="flex items-center gap-3">
      <i data-lucide="zap" class="w-6 h-6 text-blue-400"></i>
      <h1 class="text-lg font-bold text-white tracking-tight"><span data-i18n="app.title">TON Subs</span></h1>
    </div>
    <nav class="flex gap-2">
      <button id="nav-subscriptions" onclick="showPage('subscriptions'); loadSubscriptions();" class="px-3 py-1.5 text-xs font-medium rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 transition"><span data-i18n="nav.subscriptions">My Subs</span></button>
      <button id="nav-owner" onclick="showPage('owner'); loadOwnerDashboard();" class="px-3 py-1.5 text-xs font-medium rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 transition" style="display:none;"><span data-i18n="nav.owner">My Channels</span></button>
      <button id="nav-admin" onclick="showPage('admin'); loadAdminDashboard();" class="px-3 py-1.5 text-xs font-medium rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 transition" style="display:none;"><span data-i18n="nav.admin">Admin</span></button>
    </nav>
    <div id="ton-connect-button" class="flex-shrink-0"></div>
  </header>

  <main class="container mx-auto px-4 py-6 max-w-4xl">
    <section id="page-purchase" class="hidden-page">
      <div id="purchase-card" class="bg-slate-900 rounded-2xl border border-slate-800 p-6 max-w-md mx-auto shadow-lg"></div>
    </section>

    <section id="page-subscriptions" class="hidden-page">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
        <div class="bg-slate-900 rounded-2xl border border-slate-800 p-5">
          <p class="text-slate-500 text-xs uppercase tracking-wider font-semibold" data-i18n="subscriptions.status.active">Active Subs</p>
          <p id="stat-active" class="text-3xl font-bold text-white mt-1">0</p>
        </div>
        <div class="bg-slate-900 rounded-2xl border border-slate-800 p-5">
          <p class="text-slate-500 text-xs uppercase tracking-wider font-semibold" data-i18n="subscriptions.expires">Expiring Soon</p>
          <p id="stat-expiring" class="text-3xl font-bold text-white mt-1">0</p>
        </div>
        <div class="bg-slate-900 rounded-2xl border border-slate-800 p-5">
          <p class="text-slate-500 text-xs uppercase tracking-wider font-semibold">Total Spent</p>
          <p id="stat-spent" class="text-3xl font-bold text-white mt-1">0 TON</p>
        </div>
      </div>

      <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i data-lucide="list" class="w-5 h-5 text-blue-400"></i> <span data-i18n="nav.subscriptions">My Subs</span></h2>
      <div id="subscriptions-list" class="space-y-3"></div>
    </section>

    <section id="page-owner" class="hidden-page">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5 mb-8">
        <div class="bg-slate-900 rounded-2xl border border-slate-800 p-5">
          <p class="text-slate-500 text-xs uppercase tracking-wider font-semibold" data-i18n="owner.total_channels">Total Channels</p>
          <p id="owner-stat-channels" class="text-3xl font-bold text-white mt-1">0</p>
        </div>
        <div class="bg-slate-900 rounded-2xl border border-slate-800 p-5">
          <p class="text-slate-500 text-xs uppercase tracking-wider font-semibold" data-i18n="owner.total_subscribers">Total Subscribers</p>
          <p id="owner-stat-subs" class="text-3xl font-bold text-white mt-1">0</p>
        </div>
        <div class="bg-slate-900 rounded-2xl border border-slate-800 p-5">
          <p class="text-slate-500 text-xs uppercase tracking-wider font-semibold" data-i18n="owner.earnings_pending">Earnings (pending)</p>
          <p id="owner-stat-earnings" class="text-3xl font-bold text-white mt-1">0 TON</p>
        </div>
      </div>

      <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i data-lucide="radio" class="w-5 h-5 text-blue-400"></i> <span data-i18n="owner.your_channels">Your Channels</span></h2>
      <button onclick="openAddChannelModal()" class="mb-4 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-sm"><span data-i18n="owner.add_channel">Add Channel</span></button>
      <div id="channels-list" class="space-y-3 mb-8"></div>

      <div id="wallet-section" class="bg-slate-900 rounded-2xl border border-slate-800 p-5 mt-6"></div>
      <div id="withdrawal-section" class="bg-slate-900 rounded-2xl border border-slate-800 p-5 mt-6"></div>
    </section>

    <section id="page-admin" class="hidden-page">
      <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i data-lucide="shield-alert" class="w-5 h-5 text-blue-400"></i> <span data-i18n="admin.reports">Reported Channels</span></h2>
      <div id="admin-reports" class="space-y-3 mb-8"></div>

      <h2 class="text-xl font-bold mb-4 flex items-center gap-2"><i data-lucide="wallet" class="w-5 h-5 text-blue-400"></i> <span data-i18n="admin.withdrawals">Pending Withdrawals</span></h2>
      <div id="admin-withdrawals" class="space-y-3"></div>
    </section>
  </main>

  <!-- Edit Channel Modal -->
  <div id="edit-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md mx-4">
      <h2 class="text-xl font-bold mb-4" data-i18n="owner.edit">Edit Channel</h2>
      <label class="block text-sm text-slate-400 mb-1" data-i18n="purchase.subscription">Subscription Price (TON)</label>
      <input id="edit-price" type="number" step="0.01" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-mono mb-3" />
      <label class="block text-sm text-slate-400 mb-1" data-i18n="purchase.days">Duration (days)</label>
      <input id="edit-duration" type="number" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-mono mb-3" />
      <label class="flex items-center gap-2 text-sm text-slate-300 mb-4">
        <input id="edit-renewal" type="checkbox" class="accent-blue-500" /> Auto renewal reminders
      </label>
      <div class="flex justify-end gap-2">
        <button id="modal-cancel" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl" data-i18n="rating.cancel">Cancel</button>
        <button id="modal-save" class="px-4 py-2 bg-blue-600 text-white rounded-xl shadow-lg shadow-blue-500/20" data-i18n="owner.add_channel_submit">Save</button>
      </div>
    </div>
  </div>

  <!-- Add Channel Modal -->
  <div id="add-channel-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md mx-4">
      <h2 class="text-xl font-bold mb-4" data-i18n="owner.add_channel">Add Channel</h2>
      <label class="block text-sm text-slate-400 mb-1" data-i18n="owner.add_channel_name">Channel Name</label>
      <input id="add-channel-name" type="text" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white mb-3" />
      <label class="block text-sm text-slate-400 mb-1" data-i18n="owner.add_channel_link">Invite Link (t.me/...)</label>
      <input id="add-channel-link" type="text" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white font-mono mb-4" />
      <div class="flex justify-end gap-2">
        <button onclick="closeAddChannelModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl" data-i18n="rating.cancel">Cancel</button>
        <button onclick="submitAddChannel()" class="px-4 py-2 bg-blue-600 text-white rounded-xl" data-i18n="owner.add_channel_submit">Add</button>
      </div>
    </div>
  </div>

  <!-- Rating Modal -->
  <div id="rating-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm mx-4">
      <h3 class="text-lg font-semibold mb-2" data-i18n="rating.title">Rate this Channel</h3>
      <div id="star-rating" class="flex gap-1 text-2xl mb-3"></div>
      <textarea id="rating-comment" placeholder="Write a review..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white text-sm mb-3" rows="2"></textarea>
      <div class="flex justify-end gap-2">
        <button onclick="closeRating()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl" data-i18n="rating.cancel">Cancel</button>
        <button onclick="submitRating()" class="px-4 py-2 bg-blue-600 text-white rounded-xl" data-i18n="rating.submit">Submit</button>
      </div>
    </div>
  </div>

  <!-- Report Modal -->
  <div id="report-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-sm mx-4">
      <h3 class="text-lg font-semibold mb-2" data-i18n="report.title">Report Channel</h3>
      <select id="report-reason" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white text-sm mb-2">
        <option value="scam" data-i18n="report.reason_scam">Scam</option>
        <option value="inappropriate" data-i18n="report.reason_inappropriate">Inappropriate Content</option>
        <option value="insult" data-i18n="report.reason_insult">Insult</option>
        <option value="racism" data-i18n="report.reason_racism">Racism</option>
        <option value="other" data-i18n="report.reason_other">Other</option>
      </select>
      <textarea id="report-description" placeholder="Additional details..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-white text-sm mb-3" rows="2"></textarea>
      <div class="flex justify-end gap-2">
        <button onclick="closeReport()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl" data-i18n="report.cancel">Cancel</button>
        <button onclick="submitReport()" class="px-4 py-2 bg-red-600 text-white rounded-xl" data-i18n="report.submit">Submit Report</button>
      </div>
    </div>
  </div>

  <footer class="sticky bottom-0 bg-slate-950/90 backdrop-blur-md border-t border-slate-800 px-4 py-2 flex items-center justify-between text-xs text-slate-500">
    <div class="flex items-center gap-2">
      <span class="status-dot bg-emerald-500"></span> <span data-i18n="footer.ton_network">TON Mainnet</span>
    </div>
    <div data-i18n="footer.platform_fee">Platform fee 1%</div>
    <div class="font-mono" data-i18n="footer.version">v1.0</div>
  </footer>

  <script src="translations.js"></script>
  <script src="app.js"></script>
  <script>
    lucide.createIcons();
    applyTranslations();
  </script>
</body>
</html>
