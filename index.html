<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySubHub - Premium Channel Subscriptions</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles_v2.css">
</head>
<body class="bg-slate-900 text-white">
    <!-- Navigation Bar -->
    <nav id="nav-bar" class="fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 z-50">
        <div class="flex justify-around items-center py-2">
            <button id="nav-subscriptions" onclick="switchPage('subscriptions')" class="tab-btn flex flex-col items-center gap-1 px-4 py-2">
                <div class="tab-icon-box">📋</div>
                <span class="text-xs">Subscriptions</span>
            </button>
            <button id="nav-channels" onclick="switchPage('channels')" class="tab-btn flex flex-col items-center gap-1 px-4 py-2">
                <div class="tab-icon-box">📺</div>
                <span class="text-xs">My Channels</span>
            </button>
            <button id="nav-referrals" onclick="switchPage('referrals')" class="tab-btn flex flex-col items-center gap-1 px-4 py-2">
                <div class="tab-icon-box">🎁</div>
                <span class="text-xs">Referrals</span>
            </button>
            <button id="nav-admin" onclick="switchPage('admin')" class="tab-btn flex flex-col items-center gap-1 px-4 py-2 hidden">
                <div class="tab-icon-box">⚙️</div>
                <span class="text-xs">Admin</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="pb-20">
        <!-- Subscriptions Page -->
        <section id="page-subscriptions" class="hidden-page">
            <div class="container mx-auto px-4 py-6">
                <h2 class="text-2xl font-bold mb-4">My Subscriptions</h2>
                <div id="subscriptions-list"></div>
            </div>
        </section>

        <!-- Channels Page -->
        <section id="page-channels" class="hidden-page">
            <div class="container mx-auto px-4 py-6">
                <h2 class="text-2xl font-bold mb-4">My Channels</h2>
                <div id="channels-list"></div>
            </div>
        </section>

        <!-- Referrals Page -->
        <section id="page-referrals" class="hidden-page">
            <div class="container mx-auto px-4 py-6">
                <h2 class="text-2xl font-bold mb-4">Referral Program</h2>
                <div id="referral-dashboard"></div>
            </div>
        </section>

        <!-- Admin Page -->
        <section id="page-admin" class="hidden-page">
            <div class="container mx-auto px-4 py-6">
                <h2 class="text-2xl font-bold mb-4">Admin Dashboard</h2>
                <div id="admin-dashboard"></div>
            </div>
        </section>

        <!-- Purchase Page -->
        <section id="page-purchase" class="hidden-page">
            <div class="container mx-auto px-4 py-6">
                <div id="purchase-card"></div>
            </div>
        </section>
    </main>

    <!-- Modals -->
    <!-- Rating Modal -->
    <div id="rating-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-slate-800 rounded-xl p-6 max-w-md w-full mx-4">
            <h3 class="text-xl font-bold mb-4">Rate Channel</h3>
            <div id="star-rating" class="flex justify-center gap-2 mb-4">
                <span class="text-3xl cursor-pointer" onclick="selectRating(1)">☆</span>
                <span class="text-3xl cursor-pointer" onclick="selectRating(2)">☆</span>
                <span class="text-3xl cursor-pointer" onclick="selectRating(3)">☆</span>
                <span class="text-3xl cursor-pointer" onclick="selectRating(4)">☆</span>
                <span class="text-3xl cursor-pointer" onclick="selectRating(5)">☆</span>
            </div>
            <textarea id="rating-comment" placeholder="Add a comment (optional)" class="w-full bg-slate-700 rounded-lg p-3 mb-4"></textarea>
            <div class="flex gap-2">
                <button onclick="closeRating()" class="flex-1 btn-secondary py-2 rounded-lg">Cancel</button>
                <button onclick="submitRating()" class="flex-1 btn-primary py-2 rounded-lg">Submit</button>
            </div>
        </div>
    </div>

    <!-- Report Modal -->
    <div id="report-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
        <div class="bg-slate-800 rounded-xl p-6 max-w-md w-full mx-4">
            <h3 class="text-xl font-bold mb-4">Report Channel</h3>
            <select id="report-reason" class="w-full bg-slate-700 rounded-lg p-3 mb-4">
                <option value="scam">Scam</option>
                <option value="inappropriate">Inappropriate Content</option>
                <option value="spam">Spam</option>
                <option value="other">Other</option>
            </select>
            <textarea id="report-description" placeholder="Describe the issue" class="w-full bg-slate-700 rounded-lg p-3 mb-4"></textarea>
            <div class="flex gap-2">
                <button onclick="closeReport()" class="flex-1 btn-secondary py-2 rounded-lg">Cancel</button>
                <button onclick="submitReport()" class="flex-1 btn-primary py-2 rounded-lg">Submit</button>
            </div>
        </div>
    </div>

    <script src="app_v2.js"></script>
    <script>
        // Initialize app
        window.onload = function() {
            init();
            switchPage('subscriptions');
        };
    </script>
</body>
</html>
